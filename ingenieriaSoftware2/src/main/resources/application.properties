# ========== PERMITIR DEPENDENCIAS CIRCULARES ==========
spring.main.allow-circular-references=true

# ========== SPRING ==========
spring.application.name=ingenieriaSoftware2

# ========== SERVER ==========
server.port=8085

# ========== H2 DATABASE ==========
spring.datasource.url=jdbc:h2:mem:ingenieriaSoftware2;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ========== JWT ==========
jwt.secret=miClaveSecretaSuperSeguraParaJWTConMasDe32Caracteres
jwt.expiration=86400000

# ========== LOGGING ==========
logging.level.com.ingenieriaSoftware2=DEBUG
logging.level.org.springframework.security=DEBUG